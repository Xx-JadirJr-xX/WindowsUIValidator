<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Validation Report</title>
<!--
  Self-contained report generated by Windows UI Validator.
  Run data is embedded below as JSON (element #data); no network access is required.
-->
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --border: #dde1e7;
  --text: #1b1f24; --muted: #5f6b7a; --accent: #2f6fde;
  --pass: #1f8a4c; --pass-bg: #e3f4ea; --warn: #a76a00; --warn-bg: #fdf1d8;
  --fail: #c62f2f; --fail-bg: #fbe3e3; --err: #6b47b8; --err-bg: #ece6f8;
  --overlay-error: rgba(230, 40, 40, .9); --overlay-warn: rgba(240, 160, 0, .95); --overlay-related: rgba(47, 111, 222, .9);
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --surface: #1c2027; --surface-2: #242a33; --border: #333b47;
    --text: #e6e9ee; --muted: #98a3b3; --accent: #6b9cff;
    --pass: #4cc584; --pass-bg: #173826; --warn: #f0b54a; --warn-bg: #3d2f12;
    --fail: #ff6b6b; --fail-bg: #431d1f; --err: #b39cff; --err-bg: #2d2543;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --surface: #1c2027; --surface-2: #242a33; --border: #333b47;
  --text: #e6e9ee; --muted: #98a3b3; --accent: #6b9cff;
  --pass: #4cc584; --pass-bg: #173826; --warn: #f0b54a; --warn-bg: #3d2f12;
  --fail: #ff6b6b; --fail-bg: #431d1f; --err: #b39cff; --err-bg: #2d2543;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
header h1 { font-size: 20px; margin: 0; }
header .meta { color: var(--muted); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
header .spacer { flex: 1; }
main { padding: 20px 24px; max-width: 1600px; margin: 0 auto; }
button, select, input { font: inherit; color: inherit; }
.btn { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer; }
.card .n { font-size: 28px; font-weight: 600; }
.card .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.card.passed .n { color: var(--pass); } .card.warning .n { color: var(--warn); }
.card.failed .n { color: var(--fail); } .card.error .n { color: var(--err); }
.card.selected { outline: 2px solid var(--accent); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar input, .toolbar select { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
.toolbar input { min-width: 220px; }
.tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
.tabs button { background: none; border: none; padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); overflow: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); position: sticky; top: 0; }
tr:last-child td { border-bottom: none; }
.matrix td.cell { text-align: center; cursor: pointer; }
.matrix td.cell:hover { background: var(--surface-2); }
.pill { display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.passed { background: var(--pass-bg); color: var(--pass); } .pill.warning { background: var(--warn-bg); color: var(--warn); }
.pill.failed { background: var(--fail-bg); color: var(--fail); } .pill.error { background: var(--err-bg); color: var(--err); }
.pill.dim { opacity: .35; }
.sev { font-weight: 600; } .sev.Error { color: var(--fail); } .sev.Warning { color: var(--warn); } .sev.Info { color: var(--muted); }
.muted { color: var(--muted); }
code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.tag-new { background: var(--fail); color: #fff; border-radius: 4px; padding: 0 5px; font-size: 11px; margin-left: 6px; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.warnings { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }

/* Detail drawer */
#detail { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 10; }
#detail.open { display: block; }
#detail .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(1400px, 100%); background: var(--bg); overflow: auto; box-shadow: -4px 0 20px rgba(0,0,0,.3); }
#detail .drawer-head { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 12px; align-items: center; z-index: 2; flex-wrap: wrap; }
#detail .drawer-head h2 { margin: 0; font-size: 17px; }
#detail .drawer-body { padding: 16px 20px; display: grid; grid-template-columns: minmax(0, 3fr) minmax(320px, 2fr); gap: 16px; }
@media (max-width: 1000px) { #detail .drawer-body { grid-template-columns: 1fr; } }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 12px 16px; font-size: 13px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }
.viewer-wrap { padding: 12px; }
.viewer { position: relative; display: inline-block; max-width: 100%; line-height: 0; background: repeating-conic-gradient(var(--surface-2) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; }
.viewer img { max-width: 100%; height: auto; display: block; }
.viewer svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.viewer svg rect { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
.viewer svg rect.Error { stroke: var(--overlay-error); fill: rgba(230,40,40,.08); }
.viewer svg rect.Warning { stroke: var(--overlay-warn); fill: rgba(240,160,0,.08); }
.viewer svg rect.related { stroke: var(--overlay-related); stroke-dasharray: 5 3; }
.viewer svg rect.hl { stroke-width: 4; fill: rgba(47,111,222,.18); }
.viewer svg rect.el { stroke: var(--overlay-related); fill: rgba(47,111,222,.15); }
.slider { position: relative; display: inline-block; max-width: 100%; line-height: 0; }
.slider img { max-width: 100%; display: block; }
.slider .top { position: absolute; inset: 0; overflow: hidden; }
.slider .top img { max-width: none; }
.slider input { width: 100%; margin-top: 8px; }
.view-modes { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.findings tr { cursor: pointer; }
.findings tr:hover td, .findings tr.hl td { background: var(--surface-2); }
.tree { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; padding: 8px 12px; max-height: 420px; overflow: auto; }
.tree details { margin-left: 14px; }
.tree summary, .tree .leaf { cursor: default; padding: 1px 0; white-space: nowrap; }
.tree .leaf { margin-left: 14px; }
.tree .t { color: var(--accent); } .tree .off { opacity: .5; }
section h3 { font-size: 14px; margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--border); }
section + section { margin-top: 16px; }
pre.log { margin: 0; padding: 10px 16px; font-size: 12px; white-space: pre-wrap; max-height: 260px; overflow: auto; }
@media (max-width: 640px) { header, main { padding-left: 16px; padding-right: 16px; } .toolbar input { min-width: 0; width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>UI Validation Report</h1>
  <div class="meta" id="meta"></div>
  <div class="spacer"></div>
  <button class="btn" id="themeBtn" title="Toggle theme">◐ Theme</button>
</header>
<main>
  <div id="warnings"></div>
  <div class="cards" id="cards"></div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search element, AutomationId or message…">
    <select id="ruleFilter"><option value="">All rules</option></select>
    <select id="severityFilter">
      <option value="">All severities</option><option value="Error">Errors only</option><option value="Warning">Warnings and errors</option>
    </select>
    <select id="screenFilter"><option value="">All screens</option></select>
    <button class="btn" id="clearFilters">Clear filters</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-tab="matrix" class="active">Matrix</button>
    <button data-tab="rules">By problem</button>
    <button data-tab="findings">All findings</button>
  </div>
  <div id="view"></div>
</main>

<div id="detail"><div class="drawer" id="drawer"></div></div>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
(() => {
  "use strict";
  const run = JSON.parse(document.getElementById("data").textContent);
  const results = run.results || [];
  const state = { tab: "matrix", status: "", search: "", rule: "", severity: "", screen: "" };
  const statusClass = s => (s || "").toLowerCase();
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const newKeys = new Set(run.comparison?.newKeys || []);
  const $ = id => document.getElementById(id);

  // ---------- Theme ----------
  try { const t = localStorage.getItem("uiv-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  $("themeBtn").onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("uiv-theme", next); } catch {}
  };

  // ---------- Header ----------
  const dur = (new Date(run.finishedAt) - new Date(run.startedAt)) / 1000;
  $("meta").innerHTML = [
    `<span title="${esc(run.appPath)}"><b>${esc(run.appPath.split(/[\\/]/).pop())}</b>${run.appVersion ? " v" + esc(run.appVersion) : ""}</span>`,
    `<span>${new Date(run.startedAt).toLocaleString()}</span>`,
    `<span>${isFinite(dur) ? dur.toFixed(0) + "s" : ""}</span>`,
    `<span>${esc(run.machine)}</span>`,
    run.originalDisplay ? `<span>Display: ${esc(run.originalDisplay)}</span>` : "",
    `<span class="muted">v${esc(run.toolVersion)}</span>`,
  ].join("");
  if (run.warnings?.length)
    $("warnings").innerHTML = `<div class="warnings">${run.warnings.map(esc).join("<br>")}</div>`;
  document.title = `UI Validation · ${run.appPath.split(/[\\/]/).pop()}`;

  // ---------- Filters ----------
  const rules = [...new Set(results.flatMap(r => r.findings.map(f => f.rule)))].sort();
  rules.forEach(r => $("ruleFilter").insertAdjacentHTML("beforeend", `<option>${esc(r)}</option>`));
  (run.screens || []).forEach(s => $("screenFilter").insertAdjacentHTML("beforeend", `<option>${esc(s)}</option>`));

  const findingMatches = f => {
    if (state.rule && f.rule !== state.rule) return false;
    if (state.severity === "Error" && f.severity !== "Error") return false;
    if (state.severity === "Warning" && f.severity === "Info") return false;
    if (state.search) {
      const hay = [f.message, f.automationId, f.elementName, f.elementLabel, f.relatedLabel, f.rule].join(" ").toLowerCase();
      if (!hay.includes(state.search)) return false;
    }
    return true;
  };
  const findingFilterActive = () => state.rule || state.severity || state.search;
  const visibleFindings = r => r.findings.filter(findingMatches);
  const resultMatches = r => {
    if (state.screen && r.screen !== state.screen) return false;
    if (state.status && statusClass(r.status) !== state.status) return false;
    if (findingFilterActive() && visibleFindings(r).length === 0) return false;
    return true;
  };

  $("search").oninput = e => { state.search = e.target.value.trim().toLowerCase(); render(); };
  $("ruleFilter").onchange = e => { state.rule = e.target.value; render(); };
  $("severityFilter").onchange = e => { state.severity = e.target.value; render(); };
  $("screenFilter").onchange = e => { state.screen = e.target.value; render(); };
  $("clearFilters").onclick = () => {
    Object.assign(state, { status: "", search: "", rule: "", severity: "", screen: "" });
    $("search").value = ""; $("ruleFilter").value = ""; $("severityFilter").value = ""; $("screenFilter").value = "";
    render();
  };
  $("tabs").onclick = e => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    state.tab = b.dataset.tab;
    [...$("tabs").children].forEach(c => c.classList.toggle("active", c === b));
    render();
  };

  // ---------- Summary cards ----------
  function renderCards() {
    const count = s => results.filter(r => r.status === s).length;
    const total = results.reduce((n, r) => n + r.findings.length, 0);
    const cards = [
      ["", results.length, "Checks"], ["passed", count("Passed"), "Passed"], ["warning", count("Warning"), "Warnings"],
      ["failed", count("Failed"), "Failed"], ["error", count("Error"), "Errors"], ["findings", total, "Findings"],
    ];
    $("cards").innerHTML = cards.map(([cls, n, l]) =>
      `<div class="card ${cls} ${state.status === cls && cls ? "selected" : ""}" data-status="${cls}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
    $("cards").onclick = e => {
      const c = e.target.closest(".card"); if (!c) return;
      const s = c.dataset.status;
      state.status = (s === "findings" || s === state.status) ? "" : s;
      render();
    };
  }

  // ---------- Views ----------
  const pill = (r, extra = "") => {
    const f = visibleFindings(r);
    const e = f.filter(x => x.severity === "Error").length, w = f.filter(x => x.severity === "Warning").length;
    const label = r.status === "Error" ? "error" : r.status === "Passed" ? "✓ pass" : [e && `${e} ✕`, w && `${w} ⚠`].filter(Boolean).join(" ");
    return `<span class="pill ${statusClass(r.status)} ${extra}">${label || "✓"}</span>`;
  };

  function renderMatrix() {
    const screens = (run.screens || []).filter(s => !state.screen || s === state.screen);
    const rows = (run.scenarios || []).map(sc => {
      const cells = screens.map(s => {
        const r = results.find(x => x.scenario.id === sc.id && x.screen === s);
        if (!r) return `<td class="cell muted">—</td>`;
        const idx = results.indexOf(r);
        const extra = resultMatches(r) ? "" : "dim";
        const sim = r.similarity != null ? `<div class="muted" style="font-size:11px">${(r.similarity * 100).toFixed(1)}% match</div>` : "";
        return `<td class="cell" data-idx="${idx}">${pill(r, extra)}${sim}</td>`;
      }).join("");
      return `<tr><td><b>${esc(sc.resolution || "native")}</b> <span class="muted">@ ${sc.dpiScale ? sc.dpiScale + "%" : "native DPI"}</span><div class="muted">${esc(sc.windowSize)}</div></td>${cells}</tr>`;
    }).join("");
    return `<div class="panel"><table class="matrix"><thead><tr><th>Scenario</th>${screens.map(s => `<th style="text-align:center">${esc(s)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function renderByRule() {
    const groups = new Map();
    results.filter(r => !state.screen || r.screen === state.screen).forEach((r, _) => {
      visibleFindings(r).forEach(f => {
        const g = groups.get(f.key) || { f, hits: [] };
        g.hits.push(results.indexOf(r));
        groups.set(f.key, g);
      });
    });
    const list = [...groups.values()].sort((a, b) => (a.f.severity === b.f.severity ? b.hits.length - a.hits.length : a.f.severity === "Error" ? -1 : 1));
    if (!list.length) return `<div class="panel empty">No problems match the current filters. 🎉</div>`;
    const rows = list.map(g => `
      <tr>
        <td><span class="sev ${g.f.severity}">${g.f.severity}</span></td>
        <td><code>${esc(g.f.rule)}</code></td>
        <td>${esc(g.f.elementLabel || "")}${g.f.relatedLabel ? ` <span class="muted">↔ ${esc(g.f.relatedLabel)}</span>` : ""}${newKeys.has(g.f.key) ? '<span class="tag-new">NEW</span>' : ""}</td>
        <td><b>${g.hits.length}</b> / ${results.length}</td>
        <td>${g.hits.map(i => `<a href="#" data-idx="${i}" title="${esc(results[i].screen)}">${esc(results[i].scenario.label)} · ${esc(results[i].screen)}</a>`).join("<br>")}</td>
      </tr>`).join("");
    const resolved = run.comparison?.resolvedKeys?.length
      ? `<p class="muted" style="padding:0 12px">Resolved since previous run: ${run.comparison.resolvedKeys.map(k => `<code>${esc(k)}</code>`).join(" ")}</p>` : "";
    return `<div class="panel"><table><thead><tr><th>Severity</th><th>Rule</th><th>Element</th><th>Occurrences</th><th>Where</th></tr></thead><tbody>${rows}</tbody></table>${resolved}</div>`;
  }

  function renderAllFindings() {
    const rows = results.filter(resultMatches).flatMap(r => {
      const i = results.indexOf(r);
      return visibleFindings(r).map(f => `<tr>
        <td><span class="sev ${f.severity}">${f.severity}</span></td><td><code>${esc(f.rule)}</code></td>
        <td>${esc(f.message)}${newKeys.has(f.key) ? '<span class="tag-new">NEW</span>' : ""}</td>
        <td><a href="#" data-idx="${i}">${esc(r.scenario.label)}</a><div class="muted">${esc(r.screen)}</div></td></tr>`);
    });
    const errors = results.filter(r => r.status === "Error" && resultMatches(r)).map(r => `<tr>
        <td><span class="sev Error">Error</span></td><td><code>run</code></td><td>${esc(r.errorMessage)}</td>
        <td><a href="#" data-idx="${results.indexOf(r)}">${esc(r.scenario.label)}</a><div class="muted">${esc(r.screen)}</div></td></tr>`);
    const all = errors.concat(rows);
    if (!all.length) return `<div class="panel empty">No findings match the current filters.</div>`;
    return `<div class="panel"><table><thead><tr><th>Severity</th><th>Rule</th><th>Message</th><th>Scenario</th></tr></thead><tbody>${all.join("")}</tbody></table></div>`;
  }

  function render() {
    renderCards();
    const v = $("view");
    v.innerHTML = state.tab === "matrix" ? renderMatrix() : state.tab === "rules" ? renderByRule() : renderAllFindings();
    v.onclick = e => {
      const t = e.target.closest("[data-idx]"); if (!t) return;
      e.preventDefault();
      openDetail(+t.dataset.idx);
    };
  }

  // ---------- Detail drawer ----------
  let current = -1;
  function openDetail(idx) {
    current = idx;
    const r = results[idx];
    const findings = r.findings;
    const facts = [
      ["Status", `<span class="pill ${statusClass(r.status)}">${r.status}</span>`],
      ["Requested", esc(r.scenario.label)],
      ["Actual display", `${esc(r.actualResolution || "?")} @ ${r.actualDpiScale ? r.actualDpiScale + "%" : "?"}`],
      ["Window", r.windowBounds ? `${r.windowBounds.width}×${r.windowBounds.height} at (${r.windowBounds.x}, ${r.windowBounds.y})` : "—"],
      ["Elements", r.elementCount ?? "—"],
      ["Similarity", r.similarity != null ? `${(r.similarity * 100).toFixed(2)}%` : "no baseline"],
      ["Duration", `${(r.durationMs / 1000).toFixed(1)}s`],
    ];
    if (r.errorMessage) facts.push(["Error", `<span class="sev Error">${esc(r.errorMessage)}</span>`]);

    const modes = [["current", "Current"]];
    if (r.baselinePath) modes.push(["baseline", "Baseline"], ["slider", "Compare slider"]);
    if (r.diffPath) modes.push(["diff", "Difference"]);

    $("drawer").innerHTML = `
      <div class="drawer-head">
        <button class="btn" id="closeDetail">✕ Close</button>
        <button class="btn" id="prevDetail" title="Previous (←)">←</button>
        <button class="btn" id="nextDetail" title="Next (→)">→</button>
        <h2>${esc(r.screen)} <span class="muted">· ${esc(r.scenario.label)}</span></h2>
      </div>
      <div class="drawer-body">
        <div>
          <section class="panel">
            <h3>Screenshot</h3>
            <div class="viewer-wrap">
              ${r.screenshotPath ? `<div class="view-modes" id="modes">${modes.map(([m, l], i) => `<button class="btn ${i ? "" : "active"}" data-mode="${m}">${l}</button>`).join("")}
                <label class="muted" style="margin-left:auto;line-height:2"><input type="checkbox" id="showOverlay" checked> Overlays</label></div>
                <div id="imageArea"></div>` : `<div class="empty">No screenshot was captured.</div>`}
            </div>
          </section>
          ${r.elements?.length ? `<section class="panel"><h3>UI Automation tree <span class="muted">(hover to locate)</span></h3><div class="tree" id="tree">${renderTree(r.elements)}</div></section>` : ""}
        </div>
        <div>
          <section class="panel"><dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></section>
          <section class="panel">
            <h3>Findings (${findings.length})</h3>
            ${findings.length ? `<table class="findings"><tbody>${findings.map((f, i) => `
              <tr data-f="${i}"><td><span class="sev ${f.severity}">${f.severity}</span><div><code>${esc(f.rule)}</code></div></td>
              <td>${esc(f.message)}${newKeys.has(f.key) ? '<span class="tag-new">NEW</span>' : ""}
              ${f.automationId ? `<div class="muted">AutomationId: <code>${esc(f.automationId)}</code></div>` : ""}
              ${f.bounds ? `<div class="muted">at ${f.bounds.x},${f.bounds.y} · ${f.bounds.width}×${f.bounds.height}</div>` : ""}</td></tr>`).join("")}</tbody></table>`
              : `<div class="empty">No findings.</div>`}
          </section>
          ${r.log?.length ? `<section class="panel"><h3>Log</h3><pre class="log">${esc(r.log.join("\n"))}</pre></section>` : ""}
        </div>
      </div>`;

    $("detail").classList.add("open");
    $("closeDetail").onclick = closeDetail;
    $("prevDetail").onclick = () => step(-1);
    $("nextDetail").onclick = () => step(1);
    if (r.screenshotPath) {
      showMode(r, "current");
      $("modes").onclick = e => {
        const b = e.target.closest("button[data-mode]"); if (!b) return;
        [...$("modes").querySelectorAll("button")].forEach(x => x.classList.toggle("active", x === b));
        showMode(r, b.dataset.mode);
      };
      $("showOverlay").onchange = e => document.querySelectorAll("#imageArea svg").forEach(s => s.style.display = e.target.checked ? "" : "none");
    }
    document.querySelectorAll(".findings tr").forEach(tr => {
      tr.onmouseenter = () => highlight(+tr.dataset.f, true);
      tr.onmouseleave = () => highlight(+tr.dataset.f, false);
    });
    const tree = $("tree");
    if (tree) {
      tree.onmouseover = e => { const n = e.target.closest("[data-el]"); showElement(n ? r.elements.find(x => x.id === +n.dataset.el) : null); };
      tree.onmouseleave = () => showElement(null);
    }
  }

  function overlaySvg(r, w, h) {
    const rects = r.findings.map((f, i) => {
      let s = "";
      if (f.relatedBounds) s += `<rect class="related" data-f="${i}" x="${f.relatedBounds.x}" y="${f.relatedBounds.y}" width="${f.relatedBounds.width}" height="${f.relatedBounds.height}"></rect>`;
      if (f.bounds) s += `<rect class="${f.severity}" data-f="${i}" x="${f.bounds.x}" y="${f.bounds.y}" width="${f.bounds.width}" height="${f.bounds.height}"><title>${esc(f.message)}</title></rect>`;
      return s;
    }).join("");
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${rects}<rect class="el" id="elRect" style="display:none"></rect></svg>`;
  }

  function showMode(r, mode) {
    const area = $("imageArea");
    const w = r.windowBounds?.width || 0, h = r.windowBounds?.height || 0;
    const overlays = $("showOverlay")?.checked !== false;
    const svg = () => overlays ? overlaySvg(r, w, h) : overlaySvg(r, w, h).replace("<svg ", '<svg style="display:none" ');
    if (mode === "slider") {
      area.innerHTML = `<div class="slider" id="sl"><img src="${esc(r.baselinePath)}" alt="baseline"><div class="top" id="slTop"><img src="${esc(r.screenshotPath)}" alt="current"></div></div>
        <input type="range" min="0" max="100" value="50" id="slRange"><div class="muted" style="line-height:1.4">Left: current · Right: baseline</div>`;
      const top = $("slTop"), base = area.querySelector(".slider > img");
      const sync = () => { top.style.width = $("slRange").value + "%"; top.querySelector("img").style.width = base.clientWidth + "px"; };
      $("slRange").oninput = sync; base.onload = sync; sync();
      return;
    }
    const src = mode === "baseline" ? r.baselinePath : mode === "diff" ? r.diffPath : r.screenshotPath;
    area.innerHTML = `<div class="viewer"><img src="${esc(src)}" alt="${mode}">${mode === "current" ? svg() : ""}</div>`;
  }

  function highlight(i, on) {
    document.querySelectorAll(`#imageArea rect[data-f="${i}"]`).forEach(x => x.classList.toggle("hl", on));
  }

  function showElement(el) {
    const rect = document.getElementById("elRect"); if (!rect) return;
    if (!el || !el.bounds || el.bounds.width <= 0) { rect.style.display = "none"; return; }
    Object.entries({ x: el.bounds.x, y: el.bounds.y, width: el.bounds.width, height: el.bounds.height }).forEach(([k, v]) => rect.setAttribute(k, v));
    rect.style.display = "";
  }

  function renderTree(elements) {
    const children = new Map();
    elements.forEach(e => { const k = e.parentId ?? -1; if (!children.has(k)) children.set(k, []); children.get(k).push(e); });
    const label = e => `<span data-el="${e.id}" class="${e.offscreen ? "off" : ""}"><span class="t">${esc(e.controlType)}</span>${e.automationId ? ` #${esc(e.automationId)}` : ""}${e.name ? ` "${esc(e.name.slice(0, 60))}"` : ""} <span class="muted">${e.bounds.width}×${e.bounds.height}</span></span>`;
    const node = (e, depth) => {
      const kids = children.get(e.id) || [];
      if (!kids.length) return `<div class="leaf">${label(e)}</div>`;
      return `<details ${depth < 2 ? "open" : ""}><summary>${label(e)}</summary>${kids.map(k => node(k, depth + 1)).join("")}</details>`;
    };
    return (children.get(-1) || []).map(e => node(e, 0)).join("");
  }

  function step(delta) {
    const visible = results.map((r, i) => i).filter(i => resultMatches(results[i]));
    const pos = visible.indexOf(current);
    const next = visible[(pos + delta + visible.length) % visible.length];
    if (next != null) openDetail(next);
  }
  function closeDetail() { $("detail").classList.remove("open"); current = -1; }
  $("detail").onclick = e => { if (e.target.id === "detail") closeDetail(); };
  document.addEventListener("keydown", e => {
    if (current < 0) return;
    if (e.key === "Escape") closeDetail();
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
  });

  render();
})();
</script>
</body>
</html>
